name: Build & Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Verify Build
        run: npm run build

      - name: Deploy to Vercel Production
        if: github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_7YvJIbVcbfvvryNY42xVzM2i' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_til6G5Ce0Q8VmgHrcVkZj2hvi9An' }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "🚀 VERCEL_TOKEN detected. Installing Vercel CLI and deploying..."
            npm install --global vercel@latest
            echo "Pulling project configuration..."
            vercel pull --yes --environment=production --token=$VERCEL_TOKEN
            echo "Building production deployment..."
            vercel build --prod --token=$VERCEL_TOKEN
            echo "Publishing to production..."
            vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
            echo "✅ Deployment via Vercel CLI completed successfully!"
          else
            echo "ℹ️  Notice: VERCEL_TOKEN secret is not configured in GitHub Secrets."
            echo "✅ Build verification passed successfully. Deployment is handled automatically by native Vercel GitHub Integration or local CLI."
          fi
