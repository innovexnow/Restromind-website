name: Build & Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Verify Build
        run: npm run build

      - name: Deploy to Vercel Production
        if: github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_7YvJIbVcbfvvryNY42xVzM2i' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_til6G5Ce0Q8VmgHrcVkZj2hvi9An' }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is missing in GitHub Repository Secrets!"
            echo "::notice::To enable automatic production deployments for all developers:"
            echo "1. Go to https://vercel.com/account/tokens and generate a token (Scope: innovexnow-7923's projects)."
            echo "2. Add it as 'VERCEL_TOKEN' in https://github.com/innovexnow/Restromind-website/settings/secrets/actions"
            echo "OR connect GitHub directly in Vercel Dashboard at https://vercel.com/innovexnow-7923s-projects/restromind-website/settings/git"
            exit 1
          fi

          echo "🚀 VERCEL_TOKEN detected. Installing Vercel CLI..."
          npm install --global vercel@latest

          echo "Pulling Vercel project configuration..."
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN

          echo "Building production deployment..."
          vercel build --prod --token=$VERCEL_TOKEN

          echo "Publishing to production..."
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
          echo "✅ Production deployment completed successfully on Vercel!"
